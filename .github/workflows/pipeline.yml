name: Data pipeline

# Refreshes World Bank series and the news tracker, validates the result, and
# commits only if something actually changed. A failed upstream leaves the last
# good data in place rather than blanking the site.

on:
  schedule:
    # Every 6 hours. Events are the fast-moving part; the World Bank
    # connector is cached and cheap to re-run.
    - cron: "15 */6 * * *"
  workflow_dispatch:
  # Also run when the ingest code itself changes, so a connector fix is
  # exercised against live feeds immediately rather than waiting for the
  # next scheduled window.
  push:
    branches: [claude/india-defence-infra-tracker-qfpsfu]
    paths:
      - "scripts/etl/**"
      - "lib/sources.ts"
      - "lib/gazetteer.ts"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run ETL
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: activates the X connector. Absent, it reports inactive.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run etl

      - name: Validate data
        run: npm run validate

      - name: Audit chart registry
        run: npm run registry:audit

      # Refreshed events change the seed file. Regenerate it in the same commit,
      # otherwise the next CI run fails db:seed-check on drift the bot created.
      - name: Regenerate seed SQL
        run: npm run db:seed-sql

      - name: Typecheck
        run: npm run typecheck

      - name: Commit refreshed data
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/series/wdi.json data/series/security.json data/series/security-curated.json data/live/ data/events.json supabase/seed.sql 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): scheduled pipeline refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

name: Ingest arsenal tracker

# Tries every open dataset on protest, repression and state breakdown, records
# exactly what each host answered, and commits the report. Publishes no series.
#
# This exists because the editing sandbox cannot reach api.worldbank.org — the
# egress proxy answers 403 to CONNECT — so reachability has to be established
# from somewhere that can. Every connector in this repo was built this way.
#
# Manual and on-change only.

on:
  workflow_dispatch:
  schedule:
    # Twice a day. The feeds carry a few days of items, so this never
    # misses a story, and it is gentle on seven publishers.
    - cron: "40 5,17 * * *"
  push:
    paths:
      - "scripts/etl/connectors/arsenal.ts"
      - ".github/workflows/ingest-arsenal.yml"

permissions:
  contents: write

concurrency:
  group: ingest-arsenal
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Ingest
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: npm run arsenal:ingest

      # Always: the probe writes after every target, so a run killed by the
      # timeout still has findings worth keeping.
      - name: Commit the probe report
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/global/arsenal.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Probe report unchanged."
            exit 0
          fi
          git commit -m "chore(data): arsenal tracker $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

name: Ingest stability datasets

# Reads the eighteen country-year datasets the probe found reachable and
# reduces them to one file the report carries. Runs where the network works;
# the editing sandbox cannot reach ourworldindata.org at all.
#
# The connector's self-checks are the gate: it exits non-zero if the country
# count collapses, if the democracy column stops putting Nordics at the top and
# North Korea at the bottom, or if Syria's deadliest year drifts outside its
# civil war. A silently mis-parsed column here would produce a full, plausible,
# wrong ranking of countries.
#
# Manual and on-change only.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/connectors/stability.ts"
      - ".github/workflows/ingest-stability.yml"

permissions:
  contents: write

concurrency:
  group: ingest-stability
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Probe
        run: npm run stability:ingest

      # Always: the probe writes after every target, so a run killed by the
      # timeout still has findings worth keeping.
      - name: Commit the probe report
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/global/stability.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Probe report unchanged."
            exit 0
          fi
          git commit -m "chore(data): global stability datasets $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

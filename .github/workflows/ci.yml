name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The data gate runs first: if a number lost its source, nothing else matters.
      - name: Validate data provenance
        run: npm run validate

      - name: Audit chart registry
        run: npm run registry:audit

      # Runs the real migration against Postgres-in-WASM, so schema changes are
      # exercised before they reach a database shared with other projects.
      - name: Schema tests
        run: npm run test:schema

      - name: Ingest tests
        run: npm run test:ingest

      # supabase/seed.sql is committed so it can be pasted straight into the
      # SQL editor. This fails if it has drifted from the JSON it is built from.
      - name: Seed file is in sync with the data
        run: npm run db:seed-check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

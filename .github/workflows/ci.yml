name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The data gate runs first: if a number lost its source, nothing else matters.
      - name: Validate data provenance
        run: npm run validate

      - name: Audit chart registry
        run: npm run registry:audit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The data gate runs first: if a number lost its source, nothing else matters.
      - name: Validate data provenance
        run: npm run validate

      - name: Audit chart registry
        run: npm run registry:audit

      # Runs the real migration against Postgres-in-WASM, so schema changes are
      # exercised before they reach a database shared with other projects.
      - name: Schema tests
        run: npm run test:schema

      - name: Ingest tests
        run: npm run test:ingest

      # docs/data-sources.mdx is rendered as a page, so its counted claims are
      # published content. This fails if the document overstates its own coverage.
      # The constructed indices compute a number nobody upstream will
      # contradict, so their arithmetic is tested rather than eyeballed.
      - name: Security index tests
        run: npm run test:security

      # Hand-entered figures are the one path in that no upstream will
      # contradict, so the gate is stricter than for scraped data.
      # Layout reconstruction from a PDF is a guess about geometry, and this
      # project has published wrong numbers from a layout guess before.
      - name: PDF extraction tests
        run: npm run test:pdf

      - name: Curated security data
        run: npm run security:check

      - name: Doc tests
        run: npm run test:docs

      # supabase/seed.sql is committed so it can be pasted straight into the
      # SQL editor. This fails if it has drifted from the JSON it is built from.
      - name: Seed file is in sync with the data
        run: npm run db:seed-check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

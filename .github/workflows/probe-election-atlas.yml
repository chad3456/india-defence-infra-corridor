name: Probe election atlas sources

# What ECI's results portal still hosts, and what its pages look like; where
# the SIR deletion figures and the list of who governs each state can be read.
# Writes data/live/election-atlas-probe.json and sample pages. Publishes nothing.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-election-atlas.ts"
      - ".github/workflows/probe-election-atlas.yml"

permissions:
  contents: write

concurrency:
  group: probe-election-atlas
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run atlas:elections:probe
      - name: Commit
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/election-atlas-probe.json data/live/election-atlas-samples 2>/dev/null || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore(probe): election atlas sources $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && break; sleep $((2**i)); git pull --rebase origin "${GITHUB_REF_NAME}" || true; done

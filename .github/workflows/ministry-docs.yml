name: Pin ministry documents

# Downloads the Commerce Ministry's monthly foreign-trade releases and the Home
# Ministry's Monthly Major Achievements into data/pdf/, with their text in
# data/ministry/. Monthly, a few days after the 15th, when the trade release
# is out; documents already pinned are not downloaded again.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 18 * *"
  push:
    paths:
      - "scripts/etl/connectors/ministry-docs.ts"
      - ".github/workflows/ministry-docs.yml"

permissions:
  contents: write
concurrency:
  group: ministry-docs
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - run: npx tsx scripts/etl/connectors/ministry-docs.ts all
        timeout-minutes: 50
      - name: Commit
        if: ${{ !cancelled() }}
        run: >
          .github/scripts/commit-generated-paths.sh
          "data(ministry): pinned documents $(date -u +'%Y-%m-%d %H:%M')"
          data/pdf/commerce data/pdf/mha data/ministry/commerce-docs.json data/ministry/mha-docs.json data/ministry/commerce-index.json

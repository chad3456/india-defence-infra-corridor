name: Ministry documents from the archive

# Two slow stages that each pick up where the last run stopped:
#   archive  the Commerce Ministry's pre-2024 trade releases from Wayback:
#            the 2020-2024 PDFs first, then the 2000-2016 release pages
#            (one request every eight seconds; Wayback refuses faster)
#   ocr      the scanned MHA monthly reports, read with tesseract
# Every three hours until there is nothing left to do, when a run takes a
# minute and commits nothing.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"
  push:
    paths:
      - ".github/workflows/ministry-archive.yml"
      - "scripts/etl/connectors/ministry-docs.ts"

permissions:
  contents: write
concurrency:
  group: ministry-docs
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The branch as it is now, not the commit that queued this run: runs in
      # this group wait for each other, and one that started from an older
      # commit would write its stale copy of the documents over the last run's.
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: npm ci
      - run: npx tsx scripts/etl/connectors/ministry-docs.ts ocr
        timeout-minutes: 25
      - run: ARCHIVE_MINUTES=35 npx tsx scripts/etl/connectors/ministry-docs.ts archive
        timeout-minutes: 40
      # Re-read every pinned document into figures; the loader re-checks each
      # quote, so a rule that misreads a new document draws nothing rather than a wrong number.
      - name: Read the documents
        if: ${{ !cancelled() }}
        run: python3 scripts/etl/ministry/extract_trade.py && python3 scripts/etl/ministry/extract_mha.py
      - name: Commit
        if: ${{ !cancelled() }}
        run: >
          .github/scripts/commit-generated-paths.sh
          "data(ministry): archived and OCR'd documents $(date -u +'%Y-%m-%d %H:%M')"
          data/pdf/commerce data/ministry/commerce-docs.json data/ministry/mha-docs.json data/ministry/trade.json data/ministry/mha.json data/ministry/commerce-archive-state.json

name: Ingest the electronics atlas

# Builds data/trade/electronics-atlas.json: world exports of 200+ electronics
# lines by every reporting country, China's and India's shares, and India's
# imports from China — from UN Comtrade.
#
# Runs here because the editing sandbox cannot reach comtradeapi.un.org.
# Monthly: annual trade data arrives once a year per reporter, and late.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 12 * *"
  push:
    paths:
      - "scripts/etl/connectors/electronics-atlas.ts"
      - "lib/electronics-catalogue.ts"
      - ".github/workflows/electronics-atlas.yml"

permissions:
  contents: write

concurrency:
  group: electronics-atlas
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ingest
        run: npm run atlas:ingest
      - name: Check
        run: npm run test:atlas
      - name: Commit
        run: >
          .github/scripts/commit-generated.sh
          data/trade/electronics-atlas.json
          "data(trade): electronics atlas $(date -u +'%Y-%m-%d %H:%M')"

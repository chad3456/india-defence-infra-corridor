name: Probe growth sources

# Which scheme portals and startup registries hand over a statewise table to a
# fetch, and which only render one in a browser. Publishes no series.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-growth.ts"
      - ".github/workflows/probe-growth.yml"

permissions:
  contents: write
concurrency:
  group: probe-growth
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run growth:probe
      - name: Commit
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/growth-probe.json 2>/dev/null || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore(sources): growth source probe $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && break; sleep $((2**i)); git pull --rebase origin "${GITHUB_REF_NAME}" || true; done

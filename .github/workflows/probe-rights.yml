name: Probe the SC/ST Act and PM SHRI sources

# Asks whether the SC/ST (Prevention of Atrocities) Act and the PM SHRI scheme
# can be reported from a published record — official series, judgments,
# Parliament answers, press coverage — or whether the numbers would have to be
# supplied from memory.
#
# Publishes no case count, no conviction rate, no school count and no claim
# about either subject.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-rights.ts"
      - ".github/workflows/probe-rights.yml"

permissions:
  contents: write

concurrency:
  group: probe-rights
  # Never cancel a run that commits data: the commit step runs `if: always()`,
  # so a cancelled run publishes a partial file over a complete one.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Probe
        run: npm run rights:probe
      - name: Commit the probe report
        if: always()
        run: >
          .github/scripts/commit-generated.sh
          data/live/rights-probe.json
          "chore(sources): SC/ST Act and PM SHRI probe $(date -u +'%Y-%m-%d %H:%M')"

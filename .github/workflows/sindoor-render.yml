name: Re-render the Sindoor walkthrough frames

# Manual only, and deliberately so.
#
# The seventeen frames are committed. They are a function of two things that
# almost never change — Natural Earth's country shapes and the sourced site
# coordinates — so rebuilding them on every push would spend twenty minutes of
# CPU to reproduce identical bytes.
#
# Blender runs here as a Python module (bpy), on CPU Cycles. EEVEE needs
# libEGL, which a headless runner does not have.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sindoor-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Install Blender as a Python module
        run: pip install bpy==5.0.1
      - name: Export the geography
        run: npm run sindoor:geo
      - name: Render
        run: npm run sindoor:render
      - name: Commit the frames
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add public/sindoor
          git diff --staged --quiet && { echo "frames unchanged"; exit 0; }
          git commit -q -m "render(sindoor): walkthrough frames $(date -u +'%Y-%m-%d %H:%M')"
          git push origin "${GITHUB_REF_NAME}"

name: OWID indicator registry

# Discovers OWID's chart slugs from its own sitemap and builds a two-tier
# registry: India plus comparators for every indicator, and latest-value-per-
# country for a capped subset the map can colour by.
#
# Runs here because the editing sandbox cannot reach ourworldindata.org.
#
# Manual and on-change only. This is a charity's infrastructure serving a
# public good for free; requests are paced and the run has a hard time budget.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/connectors/owid.ts"
      - ".github/workflows/owid.yml"

permissions:
  contents: write

concurrency:
  group: owid
  # Never cancel a run in progress.
  #
  # This job spends up to forty-six minutes pulling from a charity's servers.
  # Cancelling it throws that bandwidth away and gets it re-spent on the next
  # push, which is both wasteful and rude. It also did real damage once: a run
  # cancelled ninety seconds in had already cleared the output directory and
  # written one incremental pass, and the commit step published that — 684
  # indicators replaced by 50, with the index deleted.
  #
  # Two other changes below make a cancelled run harmless. This one makes it
  # rare, and stops the host paying for our pushes.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the registry
        run: npm run owid:build

      # The registry is many files, so the single-file commit helper will not
      # do. Same discipline: reset onto the branch, replay this run's output,
      # and fail rather than report success without the data.
      - name: Commit
        if: always()
        run: |
          set -uo pipefail
          # No index, no commit.
          #
          # This used to say the opposite: if the directory had files in it,
          # commit them, on the reasoning that shards from a run killed by the
          # timeout beat losing forty minutes of fetching. The reasoning was
          # about the timeout case and the condition was not — it asked "did
          # this run write anything", when the question is "is this better than
          # what is already committed".
          #
          # A run cancelled ninety seconds in answered yes. It had written one
          # incremental pass and no index, so this step replaced a registry of
          # 684 indicators with 50 and deleted the file that makes any of them
          # readable. The site read no registry at all.
          #
          # The connector now writes the index on every incremental pass, so a
          # run killed by the timeout has a complete, self-describing partial
          # registry that says how partial it is. That makes this check free:
          # anything worth committing has an index by construction.
          if [ ! -s data/owid/index.json ]; then
            echo "No index.json: the run was cut short before its first incremental write." >&2
            echo "Leaving the committed registry alone — shards with no index are unreadable." >&2
            exit 1
          fi
          COUNT="$(node -e 'process.stdout.write(String(require("./data/owid/index.json").indicators.length))')"
          if [ "$COUNT" -lt 1 ]; then
            echo "index.json carries no indicators. Refusing to publish it over a good one." >&2
            exit 1
          fi
          echo "Committing a registry of $COUNT indicators."
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          KEEP="$(mktemp -d)"
          cp -r data/owid "$KEEP/"
          for attempt in 1 2 3 4; do
            git fetch --quiet origin "$GITHUB_REF_NAME" || true
            git rebase --abort 2>/dev/null || true
            git reset --hard --quiet 2>/dev/null || true
            git checkout -q -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
            rm -rf data/owid
            cp -r "$KEEP/owid" data/
            git add -A data/owid
            if git diff --staged --quiet; then
              echo "The registry is unchanged from what the branch already holds."
              exit 0
            fi
            git commit --quiet -m "chore(owid): indicator registry $(date -u +'%Y-%m-%d %H:%M')"
            if git push origin "$GITHUB_REF_NAME"; then
              echo "Committed the registry."
              exit 0
            fi
            wait=$((2 ** attempt))
            echo "push failed (attempt $attempt), retrying in ${wait}s"
            sleep "$wait"
          done
          echo "Could not commit the registry after four attempts." >&2
          exit 1

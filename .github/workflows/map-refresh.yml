name: Map refresh

# Read the feeds, classify what they carry, and merge anything new onto the map.
# Commits only when the stored set actually changed, so a quiet interval costs
# one workflow minute and no commit.
#
# This is the ingest half of the pipeline only. data-pipeline.yml still owns the
# World Bank series, which update far too slowly to be worth re-fetching here.
#
# ── What the schedule actually delivers ─────────────────────────────────────
#
# This asked for every thirty minutes and did not get it. Measured across
# fifteen consecutive scheduled runs, the gaps were 117 minutes at best and 708
# at worst, median 269. GitHub deprioritises frequent cron schedules and drops
# them under load, and a half-hourly one on a non-default branch is among the
# first to go. Asking for a cadence the platform will not honour produced a map
# that looked live and could be six hours old.
#
# So the schedule now states an interval close to what is actually delivered,
# and every run queues one follow-up ten minutes later. Two runs an hour is not
# thirty-minute freshness, but it is a promise the platform keeps — and the site
# now shows the real age of the data rather than implying it is current.

on:
  schedule:
    # Hourly, which GitHub honours far more reliably than a sub-hourly cron.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      chained:
        description: "Set by a previous run; stops a follow-up chaining forever."
        required: false
        default: "no"

permissions:
  contents: write

# Never let two refreshes race for the same file. A queued run is dropped
# rather than stacked: by the time it would start, the next one is due anyway.
concurrency:
  group: map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Refresh the map
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run map:refresh

      # The same gate the site build runs. New pins are published content, and
      # nothing reaches the repository without passing it.
      - name: Validate data
        run: npm run validate

      - name: Regenerate seed SQL
        run: npm run db:seed-sql

      - name: Commit if the map moved
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/events.json data/live/ supabase/seed.sql 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new developments this half hour."
            exit 0
          fi
          git commit -m "chore(map): refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

      # One follow-up, ten minutes on, so the hourly schedule becomes roughly
      # half-hourly without asking GitHub for a cadence it throttles. A run that
      # was itself the follow-up does not queue another, so the chain is exactly
      # two deep and cannot run away.
      - name: Queue one follow-up run
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/map-refresh.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"chained\":\"yes\"}}" \
            && echo "follow-up queued" || echo "follow-up could not be queued; the hourly schedule still stands"

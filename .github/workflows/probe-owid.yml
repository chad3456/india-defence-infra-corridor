name: Probe OWID and Indian cinema

# Asks whether a thousand indicators can be discovered and fetched from a
# source that publishes its own units and citations, and which measures of
# Indian filmmaking are reachable at all.
#
# Runs here because the editing sandbox reaches almost nothing. Publishes no
# figure: only whether a source answered, in what shape, and whether its query
# parameters do anything.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-owid.ts"
      - ".github/workflows/probe-owid.yml"

permissions:
  contents: write

concurrency:
  group: probe-owid
  # Never cancel a run that commits data.
  #
  # Cancelling a job whose whole purpose is to produce a file means the file is
  # produced partially and then committed anyway, because the commit step runs
  # `if: always()`. The OWID registry lost 634 of its 684 indicators that way:
  # a push cancelled a run ninety seconds in, and the commit step published the
  # fifty it had written. Nothing failed.
  #
  # The saving cancellation offers is a few minutes of runner time. The cost is
  # the data. Queue instead.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Probe
        run: npm run owid:probe
      - name: Commit the probe report
        if: always()
        run: >
          .github/scripts/commit-generated.sh
          data/live/owid-probe.json
          "chore(sources): OWID and cinema probe $(date -u +'%Y-%m-%d %H:%M')"

name: Probe cinema sources

# Whether BookMyShow and District hand listings to a fetch or only to a
# browser, and what Wikipedia's release lists carry instead. The test is
# whether the bytes contain film titles, not whether the request succeeds.
# Publishes no series.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-cinema.ts"
      - ".github/workflows/probe-cinema.yml"

permissions:
  contents: write
concurrency:
  group: probe-cinema
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run cinema:probe
      - name: Commit
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/cinema-probe.json 2>/dev/null || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore(sources): cinema source probe $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && break; sleep $((2**i)); git pull --rebase origin "${GITHUB_REF_NAME}" || true; done

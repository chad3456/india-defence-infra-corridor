name: Probe OGD catalogue

# Searches data.gov.in for the datasets still unsourced: rail freight, buses,
# metro ridership, elections, the SIR roll revision, cinema admissions.
# Publishes no series.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-ogd.ts"
      - ".github/workflows/probe-ogd.yml"

permissions:
  contents: write
concurrency:
  group: probe-ogd
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run ogd:probe
      - name: Commit
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/ogd-probe.json 2>/dev/null || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore(sources): OGD catalogue probe $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && break; sleep $((2**i)); git pull --rebase origin "${GITHUB_REF_NAME}" || true; done

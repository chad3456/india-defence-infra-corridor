name: NFHS-6 — what IIPS publishes, before it is read

# The sandbox cannot reach nfhsiips.in. This lists the IIPS pages' document
# links and samples each NFHS-6 fact-sheet PDF (size, pages, a few pages of
# text rows) into data/nfhs6/probe.json, so the extractor is written against
# what the documents actually say. Commits no PDF and publishes no figure.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-nfhs6.ts"
      - ".github/workflows/nfhs6-probe.yml"

permissions:
  contents: write

concurrency:
  group: nfhs6-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Diagnose the connection
        continue-on-error: true
        run: |
          for h in www.nfhsiips.in nfhsiips.in rchiips.org main.mohfw.gov.in; do
            echo "== $h"; getent hosts "$h" || echo "no DNS answer"
            timeout 25 openssl s_client -connect "$h:443" -servername "$h" -showcerts </dev/null 2>&1 | grep -E "^ ?[0-9] s:|i:|Verify return code|connect:|errno" | head -12 || true
            curl -sS -o /dev/null -w "https %{http_code} %{remote_ip} %{time_total}s\n" --max-time 30 "https://$h/" || true
            curl -sS -o /dev/null -w "http %{http_code} %{remote_ip} %{time_total}s\n" --max-time 30 "http://$h/" || true
          done
          curl -sS -I --max-time 40 "https://www.nfhsiips.in/nfhsuser/assets/National%20Family%20Health%20Survey%20(NFHS-6)%202023-2024%20Fact%20Sheets.pdf" || true
      - name: Probe
        run: npx tsx scripts/etl/probe-nfhs6.ts
      - name: Commit the probe report
        if: always()
        run: |
          if [ -f data/nfhs6/probe.json ]; then
            .github/scripts/commit-generated.sh data/nfhs6/probe.json "chore(nfhs6): IIPS document probe $(date -u +'%Y-%m-%d %H:%M')"
          fi

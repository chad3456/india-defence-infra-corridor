name: Ingest China's exports

# Builds data/trade/china-exports.json from UN Comtrade: what China exports,
# product by product and destination by destination, plus the mirror view of
# what the rest of the world reports importing from China.
#
# Runs here because the editing sandbox cannot reach comtradeapi.un.org.
# Monthly: annual trade data arrives once a year per reporter, and late.

on:
  workflow_dispatch:
  schedule:
    - cron: "25 6 9 * *"
  push:
    paths:
      - "scripts/etl/connectors/china-exports.ts"
      - "lib/china-exports-shared.ts"
      - ".github/workflows/china-exports.yml"

permissions:
  contents: write

concurrency:
  group: china-exports
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ingest
        run: npm run china-exports:ingest
      - name: Check
        run: npm run test:china-exports
      - name: Commit
        run: >
          .github/scripts/commit-generated.sh
          data/trade/china-exports.json
          "data(trade): China's exports $(date -u +'%Y-%m-%d %H:%M')"

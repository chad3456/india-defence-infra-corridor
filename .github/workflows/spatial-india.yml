name: Spatial India — district data

# Reads every district indicator from Spatial India's free API
# (api.spatialindia.com) for the district map on /map, and the district
# outlines. The API is rate-limited, so values and outlines run as two jobs on
# separate runners, each resuming where the last run stopped. Every two hours
# until both are complete; after that a run finds nothing new and commits
# nothing.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"
  push:
    paths:
      - "scripts/etl/connectors/spatial-india.ts"
      - "lib/spatial-india.ts"
      - ".github/workflows/spatial-india.yml"

permissions:
  contents: write

jobs:
  read:
    strategy:
      fail-fast: false
      matrix:
        part: [values, outlines]
    concurrency:
      group: spatial-india-${{ matrix.part }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read Spatial India (${{ matrix.part }})
        env:
          SPATIAL_PART: ${{ matrix.part }}
        run: npm run spatial:india
      - name: Commit
        run: |
          files="probe districts values"
          [ "${{ matrix.part }}" = "outlines" ] && files="outlines"
          for f in $files; do
            if [ -f "data/spatial-india/$f.json" ] && [ -n "$(git status --porcelain data/spatial-india/$f.json)" ]; then
              .github/scripts/commit-generated.sh "data/spatial-india/$f.json" "data(spatial-india): $f $(date -u +'%Y-%m-%d %H:%M')"
            fi
          done

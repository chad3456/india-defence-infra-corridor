name: Probe ECI results in the Wayback Machine

# ECI's results portal keeps only the election being counted; this asks the
# Internet Archive which past result folders it saved, how many constituency
# pages each holds per state, and what a late snapshot of one looks like.
# Writes data/live/eci-wayback-probe.json and samples. Publishes nothing.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-eci-wayback.ts"
      - ".github/workflows/probe-eci-wayback.yml"

permissions:
  contents: write

concurrency:
  group: probe-eci-wayback
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      # The folder listing is committed; this run fetches one page of each kind.
      - run: npm run eci:wayback:probe
        env:
          WAYBACK_SAMPLES: "1"
      - name: Commit
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/eci-wayback-probe.json data/live/election-atlas-samples 2>/dev/null || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore(probe): ECI results in the Wayback Machine $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && break; sleep $((2**i)); git pull --rebase origin "${GITHUB_REF_NAME}" || true; done

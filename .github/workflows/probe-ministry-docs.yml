name: Probe ministry document listings

# Where commerce.gov.in and mha.gov.in keep their monthly releases, and in what
# shape. Writes data/ministry/docs-probe.json. Downloads no PDF.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-ministry-docs.ts"
      - "scripts/etl/probe-commerce-api.ts"
      - ".github/workflows/probe-ministry-docs.yml"

permissions:
  contents: write
concurrency:
  group: probe-ministry-docs
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx tsx scripts/etl/probe-commerce-api.ts
        timeout-minutes: 10
      - name: Commit the API probe
        if: ${{ !cancelled() }}
        run: >
          .github/scripts/commit-generated.sh
          data/ministry/commerce-api-probe.json
          "chore(probe): commerce API $(date -u +'%Y-%m-%d %H:%M')"
      - name: Commit the PIB probe
        if: ${{ !cancelled() }}
        run: >
          .github/scripts/commit-generated.sh
          data/ministry/pib-api-probe.json
          "chore(probe): PIB API $(date -u +'%Y-%m-%d %H:%M')"

name: Probe ECI electorate figures

# Where ECI's electorate figures per constituency (electors by gender, turnout,
# reserved category) can still be read: archived statistical reports, ECI's
# turnout sites, data.gov.in and Lok Dhaba. Writes data/live/eci-electors-probe.json.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-eci-electors.ts"
      - ".github/workflows/probe-eci-electors.yml"

permissions:
  contents: write

concurrency:
  group: probe-eci-electors
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run eci:electors:probe
      - name: Commit
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/eci-electors-probe.json data/live/election-atlas-samples 2>/dev/null || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore(probe): ECI electorate sources $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && break; sleep $((2**i)); git pull --rebase origin "${GITHUB_REF_NAME}" || true; done

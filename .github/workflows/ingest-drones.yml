name: Ingest drone operators

# Builds data/global/drones.json from the Operators section of each major
# armed type's Wikipedia article, and commits it.
#
# Runs here because the sandbox reaches no external host.


on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 1"
  push:
    paths:
      - "scripts/etl/connectors/drones.ts"
      - ".github/workflows/ingest-drones.yml"

permissions:
  contents: write

concurrency:
  group: ingest-drones
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Ingest
        run: npm run drones:ingest

      # The committed file is what the page reads, so it is checked before it
      # is committed rather than after it has already shipped.
      - name: Check the figures
        run: npm run test:drones

      - name: Commit the figures
        run: >
          .github/scripts/commit-generated.sh
          data/global/drones.json
          "chore(global): drone operators refresh $(date -u +'%Y-%m-%d %H:%M')"

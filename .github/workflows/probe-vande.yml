name: Probe Vande Bharat sources

# OSM has eight route relations traced against a fleet of roughly 160, so the
# map currently shows five per cent of the network and implies it is all of it.
# This looks for a complete, citable list plus a live-running source.
# Publishes no series.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-vande.ts"
      - ".github/workflows/probe-vande.yml"

permissions:
  contents: write
concurrency:
  group: probe-vande
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run vande:probe
      - name: Commit
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/vande-probe.json 2>/dev/null || true
          if git diff --staged --quiet; then echo unchanged; exit 0; fi
          git commit -m "chore(sources): Vande Bharat source probe $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && break; sleep $((2**i)); git pull --rebase origin "${GITHUB_REF_NAME}" || true; done

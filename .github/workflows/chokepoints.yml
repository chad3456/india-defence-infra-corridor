name: Gulf exposure and drone trade

# What India's energy imports depend on, who it trades with on each side of the
# Gulf, and what the only published country-by-country drone trade figure says.
#
# It runs here because the editing sandbox's egress refuses comtradeapi.un.org.
#
# Manual and on-change. Not scheduled: annual customs data moves once a year,
# and a free public endpoint should not be polled faster than its own source.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/connectors/chokepoints.ts"
      - ".github/workflows/chokepoints.yml"

permissions:
  contents: write

concurrency:
  group: chokepoints
  # Never cancel a run that commits data.
  #
  # Cancelling a job whose whole purpose is to produce a file means the file is
  # produced partially and then committed anyway, because the commit step runs
  # `if: always()`. The OWID registry lost 634 of its 684 indicators that way:
  # a push cancelled a run ninety seconds in, and the commit step published the
  # fifty it had written. Nothing failed.
  #
  # The saving cancellation offers is a few minutes of runner time. The cost is
  # the data. Queue instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fetch
        run: npm run chokepoints
      - name: Commit
        if: always()
        run: >
          .github/scripts/commit-generated.sh
          data/global/chokepoints.json
          "chore(global): Gulf exposure and drone trade $(date -u +'%Y-%m-%d %H:%M')"

name: Probe sacred geography sources

# Asks Wikidata, Wikipedia, the ASI and the Census what they will actually
# answer about India's temples, canonical pilgrimage sets, surveyed monuments
# and place-name history. Records what each host said and commits the report.
# Publishes no series.
#
# It runs here because the editing sandbox cannot reach these hosts — the
# egress proxy answers 403 to CONNECT for nearly everything — so reachability
# has to be established somewhere that can reach them.
#
# The one number that decides the shape of the whole feature is the row count
# from the Wikidata SPARQL query: a few thousand sites with coordinates and a
# stated deity is a map; a few dozen is a list of famous places.
#
# Manual and on-change only.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-sacred.ts"
      - ".github/workflows/probe-sacred.yml"

permissions:
  contents: write

concurrency:
  group: probe-sacred
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Probe
        env:
          # Optional. Absent is a normal state: every fetch stays direct.
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: npm run sacred:probe

      # Always: the probe writes after every target, so a run killed by the
      # SPARQL timeout still leaves the findings it did collect.
      - name: Commit the probe report
        if: always()
        run: |
          git config user.name  "bharat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/live/sacred-probe.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Probe report unchanged."
            exit 0
          fi
          git commit -m "chore(sources): sacred geography probe $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git push && break
            echo "push failed, retrying in $((2**i))s"
            sleep $((2**i))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done

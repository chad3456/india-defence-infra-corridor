name: Provision database

# Applies the schema and seeds it. Idempotent — safe to run as often as you like.
#
# ONE required secret:
#   SUPABASE_DB_URL   Supabase -> Settings -> Database -> Connection string (URI),
#                     or POSTGRES_URL_NON_POOLING from the Vercel integration.
#                     Remember to substitute your real password into the URI.
#
# Seeding runs over plain Postgres rather than the REST API, so it needs only
# this connection string and does not depend on the schema being exposed to
# PostgREST first.
#
# Optional, only for the reachability check at the end:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# Everything targets the bharat_tracker schema. No object in public is created
# or altered, so running this against a database shared with other projects
# cannot disturb them.

on:
  workflow_dispatch:
  push:
    branches: [claude/india-defence-infra-tracker-qfpsfu]
    paths:
      - "supabase/migrations/**"
      - "data/**"
      - ".github/workflows/db-setup.yml"

concurrency:
  group: db-setup
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check for the connection string
        id: creds
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Database not provisioned"
              echo ""
              echo "\`SUPABASE_DB_URL\` is not set, so the schema and seed steps were skipped."
              echo "The site still builds and deploys — it falls back to the committed JSON."
              echo ""
              echo "To provision: **Settings -> Secrets and variables -> Actions -> New repository secret**,"
              echo "name \`SUPABASE_DB_URL\`, value the Supabase connection URI (with your password"
              echo "substituted for \`[YOUR-PASSWORD]\`), then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            # A manual run means someone expected this to do something.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::SUPABASE_DB_URL is not set — nothing to provision."
              exit 1
            fi
            echo "::warning::SUPABASE_DB_URL not set; skipping provisioning."
          else
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.has_db == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install psql
        if: steps.creds.outputs.has_db == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - run: npm ci
        if: steps.creds.outputs.has_db == 'true'

      - name: Apply schema
        if: steps.creds.outputs.has_db == 'true'
        env:
          PGCONNECT_TIMEOUT: "30"
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" --set ON_ERROR_STOP=1 \
            -f supabase/migrations/0001_init.sql

      - name: Seed data
        if: steps.creds.outputs.has_db == 'true'
        env:
          PGCONNECT_TIMEOUT: "30"
        run: |
          npx tsx scripts/db/seed-sql.ts > /tmp/seed.sql
          echo "generated $(wc -l < /tmp/seed.sql) statements"
          psql "${{ secrets.SUPABASE_DB_URL }}" --set ON_ERROR_STOP=1 -f /tmp/seed.sql

      - name: Report row counts
        if: steps.creds.outputs.has_db == 'true'
        run: |
          {
            echo "### Database provisioned"
            echo ""
            echo '```'
            psql "${{ secrets.SUPABASE_DB_URL }}" -A -F' | ' -c "
              SELECT
                (SELECT count(*) FROM bharat_tracker.sources)      AS sources,
                (SELECT count(*) FROM bharat_tracker.series)       AS series,
                (SELECT count(*) FROM bharat_tracker.data_points)  AS data_points,
                (SELECT count(*) FROM bharat_tracker.series_peers) AS peers,
                (SELECT count(*) FROM bharat_tracker.events)       AS events;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the schema is reachable over the API
        if: steps.creds.outputs.has_db == 'true'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run db:check

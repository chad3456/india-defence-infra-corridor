name: Probe the story engine and Operation Sindoor sources

# Asks whether a story engine can discover military and AI-military reporting
# from a published index rather than a hand-kept list, and whether Operation
# Sindoor is reconstructable from sources that cite themselves per event.
#
# Publishes no headline, no casualty figure and no account of what happened.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/etl/probe-warstories.ts"
      - ".github/workflows/probe-warstories.yml"

permissions:
  contents: write

concurrency:
  group: probe-warstories
  # Never cancel a run that commits data: the commit step runs `if: always()`,
  # so a cancelled run publishes a partial file over a complete one.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Probe
        run: npm run warstories:probe
      - name: Commit the probe report
        if: always()
        run: >
          .github/scripts/commit-generated.sh
          data/live/warstories-probe.json
          "chore(sources): story engine and Sindoor probe $(date -u +'%Y-%m-%d %H:%M')"

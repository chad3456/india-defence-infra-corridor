<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d366b"/>
  <!-- Three rising bars: the site is a record of measured change, and the mark
       says that rather than showing a flag or a monument. -->
  <rect x="7"  y="18" width="5" height="8"  rx="1.5" fill="#86b6ef"/>
  <rect x="13.5" y="12" width="5" height="14" rx="1.5" fill="#3987e5"/>
  <rect x="20" y="6"  width="5" height="20" rx="1.5" fill="#cde2fb"/>
</svg>
